<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Facet Gradients for Obsidian / Diamond Gem -->
    <linearGradient id="diamondTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="diamondFacet1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="40%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="diamondFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="diamondFacet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#78350F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="diamondFacetCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <filter id="diamondGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#diamondGlow)">
    <!-- Crown Table (Top horizontal flat facet) -->
    <polygon points="38,28 82,28 98,48 22,48" fill="url(#diamondTop)" stroke="#FFFFFF" stroke-width="0.75" stroke-linejoin="round"/>
    
    <!-- Crown Side Triangles -->
    <polygon points="22,48 38,28 46,48" fill="url(#diamondFacet1)" stroke="#CBD5E1" stroke-width="0.5"/>
    <polygon points="46,48 38,28 82,28" fill="url(#diamondFacetCenter)" stroke="#CBD5E1" stroke-width="0.5"/>
    <polygon points="74,48 82,28 98,48" fill="url(#diamondFacet2)" stroke="#CBD5E1" stroke-width="0.5"/>
    <polygon points="46,48 82,28 74,48" fill="url(#diamondFacetCenter)" stroke="#CBD5E1" stroke-width="0.5"/>

    <!-- Pavilion (Bottom pointed facets) -->
    <polygon points="22,48 46,48 60,98" fill="url(#diamondFacet2)" stroke="#94A3B8" stroke-width="0.5"/>
    <polygon points="46,48 74,48 60,98" fill="url(#diamondFacetCenter)" stroke="#E2E8F0" stroke-width="0.5"/>
    <polygon points="74,48 98,48 60,98" fill="url(#diamondFacet3)" stroke="#D97706" stroke-width="0.5"/>

    <!-- Specular Diamond Glimmer Highlight -->
    <circle cx="38" cy="30" r="3" fill="#FFFFFF" opacity="0.95"/>
    <line x1="32" y1="30" x2="44" y2="30" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
    <line x1="38" y1="24" x2="38" y2="36" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>

    <circle cx="60" cy="95" r="2" fill="#FDE68A" opacity="0.9"/>
  </g>
</svg>
