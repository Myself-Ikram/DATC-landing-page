<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Roasted Black Assam Tea Leaf Gradient -->
    <linearGradient id="blackLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3728"/>
      <stop offset="35%" stop-color="#261A12"/>
      <stop offset="70%" stop-color="#140E0A"/>
      <stop offset="100%" stop-color="#0A0705"/>
    </linearGradient>
    <filter id="blackLeafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Curving Roasted Black Tea Leaf Body -->
  <path d="M15 105 C25 60, 60 20, 105 15 C85 55, 65 95, 15 105 Z" 
        fill="url(#blackLeafGrad)" filter="url(#blackLeafShadow)" stroke="#785336" stroke-width="1"/>

  <!-- Warm Roasted Tea Leaf Center Vein -->
  <path d="M15 105 Q60 60 105 15" stroke="#D97706" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Secondary Veins -->
  <path d="M40 85 Q52 75 60 80" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M62 62 Q75 52 85 58" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M78 44 Q88 36 94 40" stroke="#F59E0B" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Edge Sheen Highlight -->
  <path d="M22 95 C32 65, 58 35, 95 20" stroke="#A88263" stroke-width="0.75" stroke-linecap="round" opacity="0.4"/>
</svg>
