<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="goldLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="goldLeafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#261002" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Curving Golden Tea Leaf -->
  <path d="M15 105 C25 60, 60 20, 105 15 C85 55, 65 95, 15 105 Z" 
        fill="url(#goldLeafGrad)" filter="url(#goldLeafShadow)"/>
  <!-- Center Leaf Vein -->
  <path d="M15 105 Q60 60 105 15" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Secondary Veins -->
  <path d="M40 85 Q52 75 60 80" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M62 62 Q75 52 85 58" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
