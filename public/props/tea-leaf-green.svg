<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#041F10" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- Curving Tea Leaf -->
  <path d="M15 105 C25 60, 60 20, 105 15 C85 55, 65 95, 15 105 Z" 
        fill="url(#leafGrad)" filter="url(#leafShadow)"/>
  <!-- Center Leaf Vein -->
  <path d="M15 105 Q60 60 105 15" stroke="#BBF7D0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Secondary Veins -->
  <path d="M40 85 Q52 75 60 80" stroke="#BBF7D0" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <path d="M62 62 Q75 52 85 58" stroke="#BBF7D0" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <path d="M45 80 Q35 70 38 60" stroke="#14532D" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
